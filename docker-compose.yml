version: '3.8'

services:
  ageq-api:
    build: .
    ports:
      - "5003:5003"
    environment:
      - WARMUP_MODELS=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s


